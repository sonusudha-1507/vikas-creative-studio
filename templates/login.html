{% extends "base.html" %}

{% block title %}Login — VIKAS Creative Studio{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-box">
        <span class="section-tag">CLIENT PORTAL</span>
        <h1>Welcome Back</h1>
        <p>Sign in to manage your projects, chat with your editor, and download deliveries.</p>

        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="cta-btn full-width">Login</button>
        </form>

        <p class="auth-footer">
            New to VIKAS? <a href="/signup">Create an account</a>
        </p>
    </div>
</section>
{% endblock %}
