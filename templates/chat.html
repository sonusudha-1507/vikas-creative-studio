{% extends "base.html" %}

{% block title %}Project Chat{% endblock %}

{% block content %}

<section class="chat-page">

    <div class="chat-container">

        <div class="chat-header">

            <div>

                <h2>{{ project.service_name }}</h2>

                <p>

                    Project #{{ project.id }}

                </p>

            </div>

            <div>

                <span class="status status-{{ project.status|lower }}">

                    {{ project.status }}

                </span>

            </div>

        </div>

        <div
            id="messages"
            class="messages">

            {% for msg in messages %}

            <div class="message {{ msg.sender|lower }}">

                <div class="bubble">

                    <strong>

                        {{ msg.sender }}

                    </strong>

                    <p>

                        {{ msg.message }}

                    </p>

                    <small>

                        {{ msg.created_at }}

                    </small>

                </div>

            </div>

            {% endfor %}

        </div>

        <form
            id="chatForm">

            <input
                id="messageInput"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
                required>

            <button
                type="submit">

                Send

            </button>

        </form>

    </div>

</section>

<script>

const form=document.getElementById("chatForm");

const input=document.getElementById("messageInput");

const container=document.getElementById("messages");

function scrollBottom(){

    container.scrollTop=container.scrollHeight;

}

scrollBottom();

form.addEventListener("submit",function(e){

    e.preventDefault();

    fetch(

        "/chat/send/{{ project.id }}",

        {

            method:"POST",

            body:new URLSearchParams({

                message:input.value

            })

        }

    )

    .then(r=>r.json())

    .then(data=>{

        if(data.success){

            input.value="";

            loadMessages();

        }

    });

});

function loadMessages(){

    fetch(

        "/chat/messages/{{ project.id }}"

    )

    .then(r=>r.json())

    .then(data=>{

        container.innerHTML="";

        data.forEach(function(msg){

            container.innerHTML+=`

            <div class="message ${msg.sender.toLowerCase()}">

                <div class="bubble">

                    <strong>${msg.sender}</strong>

                    <p>${msg.message}</p>

                    <small>${msg.created_at}</small>

                </div>

            </div>

            `;

        });

        scrollBottom();

    });

}

setInterval(loadMessages,2000);

</script>

{% endblock %}
