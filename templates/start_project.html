{% extends "base.html" %}

{% block title %}Start a Project — VIKAS{% endblock %}

{% block content %}
<section class="project-form">
    <div class="form-box">
        <h2>Start a Project</h2>
        <p>
            Share a few details about your project.
            You’ll receive a confirmation and next steps via email.
        </p>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Type of Edit</label>
                <select name="project_type" required>
                    <option value="">Select</option>
                    <option>Video Editing</option>
                    <option>Photo Retouching</option>
                    <option>Reels / Shorts</option>
                    <option>Thumbnail / Poster</option>
                </select>
            </div>

            <div class="form-group">
                <label>Project Description</label>
                <textarea name="description" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <label>Upload Files (optional)</label>
                <input type="file" name="project_file">
                <small>Accepted: images, videos, zip, pdf (max 200MB)</small>
            </div>
            <button type="submit" class="cta-btn">
                Submit Project Request
            </button>
        </form>
    </div>
</section>
{% endblock %}
