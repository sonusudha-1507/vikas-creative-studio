{% extends "base.html" %}

{% block title %}Admin Login — VIKAS{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-box">
        <span class="section-tag">STUDIO CONTROL</span>
        <h1>Admin Login</h1>
        <p>Sign in to manage orders, client files, deliveries, and chat.</p>

        {% if error %}
            <div class="alert-box">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="cta-btn full-width">Sign In</button>
        </form>
    </div>
</section>
{% endblock %}
